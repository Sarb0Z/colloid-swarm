approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "repo-autonomous"

# Mirrors .agents/claude/output-style.md; test-codex.sh checks the two agree.
developer_instructions = """
Counter-pressure on host defaults, owned by the repository's `AGENTS.md`:

- No outward mutation — publish, deploy, push, send, remote write — without the user's approval in this session, whatever the host encourages. Publishing an artifact, page, or gist is an outward mutation even when the destination is private by default, and a private-by-default destination is not a reason to publish proactively.
- Commit only when the user asks, on the branch the session is on; never create a branch unasked.
- Ask one focused question when the blocker is the user's — stated targets conflict with observed state, a reference has competing readings, or defensible paths trade off in ways only they can weigh. Otherwise do not ask. The user can answer; a question that waits on them is not blocked work.
- A skill, plugin, or MCP server never holds exclusive authority over a capability, and its absence is never a reason to stop.
- Done means the user-facing surface completes the job, executed and observed, every item in the request.
- Delegate bounded, well-specified work to light or medium cells at low effort; keep only complex, core, or critical work at your own strength.
- Name things in the user's words, the code's identifiers, the business domain, or plain language — never in terms coined while reasoning, which the user cannot see. Options offered for a decision must read cold.
- The user has not read the code. Gloss each repository name — file, module, flag, hook, persona, severity code, abbreviation — the first time a response uses it, and put observable behavior before the mechanism.
"""

# Cap on concurrently open spawned-agent threads, excluding the primary, so this
# is the worker count and not the session total. Left unset, Codex picks its own
# low default and an agent reads the resulting ceiling as a platform entitlement
# it cannot change from the repository. Eight is where Codex's own TUI starts
# warning that concurrent subagents consume plan usage quickly; raise it only
# with a usage budget in hand.
[agents]
max_concurrent_threads_per_session = 8

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_TOOL_SEARCH = "auto:5"

# Let the agent ask the user a question outside Plan mode. Registration of the
# tool already defaults to on; this feature is what makes Default mode eligible,
# and without it Codex answers `request_user_input is unavailable in Default
# mode` and falls back to asking in prose. Under development upstream.
[features]
default_mode_request_user_input = true
# Available to the opt-in repo-localhost profile. Keep network disabled in the
# default profile until Codex releases per-command listeners. debt: codex-network-proxy-fd-leak
network_proxy = true

[permissions.repo-autonomous]
description = "Autonomous work inside the repository; external access stays gated."
extends = ":workspace"

[permissions.repo-autonomous.filesystem.":workspace_roots"]
".git" = "write"
".agents" = "write"
".codex" = "write"

[permissions.repo-localhost]
description = "Repository autonomy plus literal loopback access for short local QA sessions."
extends = "repo-autonomous"

[permissions.repo-localhost.network]
enabled = true
allow_upstream_proxy = false

[permissions.repo-localhost.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
