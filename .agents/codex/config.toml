[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_TOOL_SEARCH = "auto:5"

# Declare the request_user_input tool. Availability outside Plan mode is
# separately gated by the default_mode_request_user_input feature, and the
# tool needs an interactive terminal. See .agents/codex/README.md.
[tools]
experimental_request_user_input = { enabled = true }
