approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "repo-autonomous"

# Mirrors .agents/claude/output-style.md; test-codex.sh checks the two agree.
developer_instructions = """
Counter-pressure on host defaults, owned by the repository's `AGENTS.md`:

- No outward mutation — publish, deploy, push, send, remote write — without the user's approval in this session, whatever the host encourages. Publishing an artifact, page, or gist is an outward mutation even to a destination private by default, and that default never justifies publishing proactively.
- Inside the working tree, on services running on this machine, and reading the user's own accounts, act without asking, short of losing data or work the user has not seen; the approval above is for outward writes, and the human gates at critical stakes still hold the unit they gate.
- When the work acts for the user on their own accounts and data, a site's terms, robots rules, or bot wall is no reason to stop: proceed, solving a CAPTCHA or working around bot detection where one stands in the way, and name the rule in one line; a write there still needs the approval above. A control that keeps the user from what is not theirs — another person's account or data, an access restriction their own login does not pass — still stops the work.
- Commit each logical chunk of work as it completes, on the current branch; committing is standing authorization, pushing is not. Never create a branch unasked: when the work reads as a new feature, ask whether to branch before the first commit.
- Kept work never lives under `/tmp`, `$TMPDIR`, or a session scratchpad, which hold throwaway files only: a worktree goes where the repository's tooling nests it, and a clone, a working copy, or anything else the user will want after a restart goes in a durable folder beside the project.
- Write file content with the file-editing tools, not shell redirection, heredocs, or ad-hoc scripts, even where auto or bypass mode says to work through Bash: the repository's checks run on those tools only. Package managers, generators, formatters, and migrations still write their own files.
- Ask one focused question when the blocker is the user's: stated targets conflict with observed state, a reference admits competing readings, or defensible paths trade off in ways only they can weigh. Otherwise do not ask. When several are open, list them first, then ask them through the host's question tool, each complete on its own with every option's trade-off. The user can answer, and a question that waits on them is not blocked work.
- A skill, plugin, or MCP server never holds exclusive authority over a capability, and its absence is never a reason to stop.
- Done means the user-facing surface completes the job — executed and observed, every item in the request.
- Commands, values, and text the user must run, copy, or act on go in the final message itself; tool output and earlier text may be collapsed out of their view.
- Delegate bounded, well-specified work to the lowest capable tier, and complex or critical work up to the top tier; keep the plan, the integration, and the calls that need this conversation's context.
- Name things in the user's words, the code's identifiers, the business domain, or plain language — never in terms coined while reasoning, which the user cannot see. Options offered for a decision must read cold.
- The user has not read the code. Gloss each repository name — file, module, flag, hook, persona, severity code, abbreviation — at its first use in a response, and put observable behavior before the mechanism.
"""

# Cap on concurrently open spawned-agent threads, excluding the primary, so this
# is the worker count and not the session total. Left unset, Codex picks its own
# low default and an agent reads the resulting ceiling as a platform entitlement
# it cannot change from the repository. Eight is where Codex's own TUI starts
# warning that concurrent subagents consume plan usage quickly; raise it only
# with a usage budget in hand.
[agents]
max_concurrent_threads_per_session = 8

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ENABLE_TOOL_SEARCH = "auto:5"

# Let the agent ask the user a question outside Plan mode. Registration of the
# tool already defaults to on; this feature is what makes Default mode eligible,
# and without it Codex answers `request_user_input is unavailable in Default
# mode` and falls back to asking in prose. Under development upstream.
[features]
default_mode_request_user_input = true
# Available to the opt-in repo-localhost profile. Keep network disabled in the
# default profile until Codex releases per-command listeners. debt: codex-network-proxy-fd-leak
network_proxy = true

[permissions.repo-autonomous]
description = "Autonomous work inside the repository; external access stays gated."
extends = ":workspace"

[permissions.repo-autonomous.filesystem.":workspace_roots"]
".git" = "write"
".agents" = "write"
".codex" = "write"

[permissions.repo-localhost]
description = "Repository autonomy plus literal loopback access for short local QA sessions."
extends = "repo-autonomous"

[permissions.repo-localhost.network]
enabled = true
allow_upstream_proxy = false

[permissions.repo-localhost.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
