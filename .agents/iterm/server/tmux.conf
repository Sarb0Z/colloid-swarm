# tmux on contabo-hop for openclawops, attached from the Mac's iTerm2 "Dev server"
# tab with `tmux -CC` (TERMINAL-SPEC.md Unit 5). setup-server.sh installs it as
# ~/.tmux.conf. It is the Mac's ~/.config/tmux/tmux.conf without what the server
# lacks: lazygit, tdev, shortcuts, extrakto, pbcopy, the Neovim navigator, and
# extended-keys-format, which tmux 3.4 (Ubuntu 24.04) does not know.
# Reload: prefix r

# ── Prefix: Ctrl-a ───────────────────────────────────────────────────────────
# Ctrl-b is Claude Code's "move command to background".
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard:hyperlinks:usstyle:sync:strikethrough:focus:title"
set -s extended-keys on
# Claude Code's alerts reach iTerm2 from panes that are not on screen too.
set -g allow-passthrough all
# Copies reach the Mac's clipboard through iTerm2 (OSC 52).
set -s set-clipboard on
set -g focus-events on
set -s escape-time 10
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── The Mac's forwarded ssh key ──────────────────────────────────────────────
# et --forward-ssh-agent gives each attach a new socket; a login with a live one
# points ~/.ssh/agent.sock at it (launchers.bash), and every window reads that
# fixed path, so git in a window opened before a reconnect still reaches the key.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/agent.sock"
set -g detach-on-destroy off
set -g display-time 2000
setw -g mode-keys vi

# Claude Code's binary is named after its version (e.g. 2.1.325); show "claude".
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ── Keys ─────────────────────────────────────────────────────────────────────
# Ctrl-h/j/k/l stay unbound, so they reach Claude Code and the shell.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind s choose-tree -Zs

# Claude Code in a side pane, through the account launchers in ~/.bashrc:
# prefix a (work), A (personal), F (family), G (guest).
bind a split-window -h -l 40% -c "#{pane_current_path}" \; send-keys "claudew" Enter
bind A split-window -h -l 40% -c "#{pane_current_path}" \; send-keys "claudep" Enter
bind F split-window -h -l 40% -c "#{pane_current_path}" \; send-keys "claudef" Enter
bind G split-window -h -l 40% -c "#{pane_current_path}" \; send-keys "claudeg" Enter

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Look: TokyoNight Night, as on the Mac (shown when attached without -CC) ──
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold] #S #[bg=#16161e] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#16161e#,bg=#ff9e64#,bold] PREFIX #[default] ,}#[fg=#565f89]#{b:pane_current_path}  %H:%M "
setw -g window-status-format "#[fg=#565f89] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#bb9af7,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-bell-style "fg=#ff9e64,bold"
setw -g window-status-activity-style "fg=#e0af68"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"
setw -g mode-style "bg=#2e3c64"

# ── Sessions survive a reboot: windows and folders, not the programs in them ─
# setup-server.sh clones both plugins at pinned commits; there is no TPM.
set -g @continuum-restore 'on'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
