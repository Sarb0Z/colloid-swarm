# The outer TLS of the Signal TLS proxy: lego's certificate for 62.171.166.213,
# then the bytes as they are to the relay (relay.conf, upstream's), which reads
# the inner SNI and passes only Signal's hosts on. Upstream's own terminate
# config needs its certbot container and options-ssl-nginx.conf; this one has
# its TLS settings inline. The settings are Mozilla's "intermediate" profile.
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

stream {
    upstream relay {
        server relay:4433;
    }

    server {
        listen                443 ssl;
        proxy_pass            relay;

        access_log            off;
        error_log             /dev/null;

        # lego writes the chain (.crt) and the key (.key) as two files; the
        # renew service reloads nginx only after both are written.
        ssl_certificate       /certs/62.171.166.213.crt;
        ssl_certificate_key   /certs/62.171.166.213.key;

        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache     shared:SSL:10m;
        ssl_session_timeout   1d;
        ssl_session_tickets   off;
    }
}
