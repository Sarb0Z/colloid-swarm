[project]
name = "shifted-dialect"
version = "0.1.0"
description = "RL environment: spec-faithful implementation of randomised expression-language semantics"
readme = "README.md"
tags = ["single-turn", "code", "reasoning", "instruction-following", "eval", "train"]
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.8",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shifted_dialect"]

[tool.verifiers.eval]
num_examples = 6
rollouts_per_example = 3
