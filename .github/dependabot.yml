# Monthly npm updates for the two repository-owned MCP servers: one pull
# request per server for minor and patch releases, and one per major release.
# Each stays red until `npm ci && npm run build && npm run sbom` is committed
# on its branch, since CI fails on a stale `dist/` or `sbom.cdx.json`.
# GitHub Actions pins are raised by hand, so there is no github-actions entry.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /.agents/mcp-servers/research-mcp
      - /.agents/mcp-servers/security-mcp
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
