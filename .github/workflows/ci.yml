# Gates the scaffold's own suites and the two repository-owned MCP servers.
#
# `.agents/fetch-extension.sh` is deliberately absent: it downloads a release
# from api.github.com, and the reader-tier suites already cover the install path
# against a synthetic MV3 fixture. Do not add it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Host layout
        run: python3 .agents/check-layout.py

      - name: Skill format
        run: .agents/lint-skills.sh

      - name: Skill format link rules
        run: .agents/test-lint-skills.sh

      - name: Status strip
        run: .agents/test-statusline.sh

      - name: SEO quick-audit file checks
        run: .agents/test-seo-quick-audit.sh

      - name: Breadcrumb shape
        run: python3 .agents/lint-breadcrumbs.py

      - name: Decision shape
        run: python3 .agents/lint-decisions.py

      - name: Test isolation
        run: python3 .agents/check-test-isolation.py

      - name: SessionStart policy
        run: .agents/test-session-start.sh

      - name: Done-prime policy
        run: .agents/test-done-prime.sh

      - name: UI gate policy
        run: .agents/test-ui-gate.sh

      - name: Teardown gate policy
        run: .agents/test-teardown-gate.sh

      - name: Workloop controller
        run: .agents/test-workloop.sh

      - name: Provisioning
        run: .agents/test-provision.sh

      - name: Worktree-provision policy
        run: .agents/test-worktree-provision.sh

      - name: Parallel-writers gate
        run: .agents/test-parallel-writers.sh

      - name: Workloop inbox policy
        run: .agents/test-workloop-inbox.sh

      - name: Post-edit policy
        run: .agents/test-post-edit-check.sh

      - name: Stop-investigate policy
        run: .agents/test-stop-investigate.sh

      - name: Provenance gate policy
        run: .agents/test-provenance-gate.sh

      - name: Reviewer contract
        run: .agents/test-review-contract.sh

      - name: Provenance matcher
        run: python3 .agents/test-sources-matcher.py

      - name: Destructive-command policy
        run: python3 .agents/test-guard-destructive.py

      - name: Publish-gate policy
        run: python3 .agents/test-guard-publish.py

      - name: Device policy kit
        run: .agents/test-device-policy.sh

      - name: MCP registry
        run: .agents/test-mcp.sh

      - name: Browser sync
        run: python3 .agents/test-browser-sync.py

      - name: Permission rules
        run: .agents/test-permissions.sh

      # The suite's strongest Codex assertion loads the generated config with
      # the real binary, and self-skips when codex is absent. Nothing installs
      # it here, so surface the gap rather than reading a green run as coverage.
      - name: Codex integration
        shell: bash
        run: |
          .agents/test-codex.sh | tee "$RUNNER_TEMP/codex.log"
          if grep -q 'host loader: skipped' "$RUNNER_TEMP/codex.log"; then
            echo '::notice title=Codex loader check skipped::codex is not on PATH; static persona and project-config checks still ran.'
          fi

      - name: Root contract size
        run: python3 .agents/lint-contract.py

      - name: Export kit
        run: .agents/test-export.sh

      # check-inventory.py finds a hook or skill with no card; it cannot see a
      # card whose embedded source went stale when the file it quotes changed.
      # Regenerating here leaves the drift as a dirty tree for the next step.
      - name: Showcase source panels
        run: python3 demo/embed-src.py

      - name: Showcase inventory
        run: python3 demo/check-inventory.py

      - name: Working tree is clean
        run: .agents/check-clean-tree.sh

  # A mod's tests run inside the Claude Code binary itself, with no login.
  # The pin is the release the mods were written and validated against; raise
  # it deliberately, after `claude plugin validate` and the tests pass on the
  # new one locally.
  mods:
    name: Claude Code mods
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: '2.1.288'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Mods
        run: .agents/test-mods.sh

  servers:
    name: ${{ matrix.server }} on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [research-mcp, security-mcp]
        # Both ends of the supported range. Node 22 is the oldest LTS still
        # receiving security fixes; 24 is current. The `engines` floor is
        # >=22.0.0, the oldest runtime this matrix runs.
        node: ['22', '24']
    defaults:
      run:
        working-directory: .agents/mcp-servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .agents/mcp-servers/${{ matrix.server }}/package-lock.json

      - run: npm ci

      - run: npm run check

      # Neither server's `check` runs `build`, so a stale committed dist/ fails
      # inside check:bundle. This step still catches any other file a check
      # step rewrites or leaves behind.
      - name: Working tree is clean
        run: "$GITHUB_WORKSPACE/.agents/check-clean-tree.sh"
