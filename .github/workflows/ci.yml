# Gates the scaffold's own suites and the two repository-owned MCP servers.
#
# `.agents/fetch-extension.sh` is deliberately absent: it downloads a release
# from api.github.com, and the reader-tier suites already cover the install path
# against a synthetic MV3 fixture. Do not add it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Scaffold suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Host layout
        run: python3 .agents/check-layout.py

      - name: Skill format
        run: .agents/lint-skills.sh

      - name: SessionStart policy
        run: .agents/test-session-start.sh

      - name: Done-prime policy
        run: .agents/test-done-prime.sh

      - name: UI gate policy
        run: .agents/test-ui-gate.sh

      - name: Destructive-command policy
        run: python3 .agents/test-guard-destructive.py

      - name: Publish-gate policy
        run: python3 .agents/test-guard-publish.py

      - name: Device policy kit
        run: .agents/test-device-policy.sh

      - name: MCP registry
        run: .agents/test-mcp.sh

      # The suite's strongest Codex assertion loads the generated config with
      # the real binary, and self-skips when codex is absent. Nothing installs
      # it here, so surface the gap rather than reading a green run as coverage.
      - name: Codex integration
        shell: bash
        run: |
          .agents/test-codex.sh | tee "$RUNNER_TEMP/codex.log"
          if grep -q 'host loader: skipped' "$RUNNER_TEMP/codex.log"; then
            echo '::notice title=Codex loader check skipped::codex is not on PATH; static persona and project-config checks still ran.'
          fi

      - name: Export kit
        run: .agents/test-export.sh

      - name: Showcase inventory
        run: python3 demo/check-inventory.py

      - name: Working tree is clean
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
            echo '::error title=Working tree is dirty::A step left tracked changes or new files behind.'
            exit 1
          fi

  servers:
    name: ${{ matrix.server }} on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [research-mcp, security-mcp]
        # Both ends of the supported range. Node 22 is the oldest LTS still
        # receiving security fixes; 24 is current. The `engines` floor of
        # 20.19.0 names a runtime that reached end of life on 2026-04-30, so
        # nothing here runs it.
        node: ['22', '24']
    defaults:
      run:
        working-directory: .agents/mcp-servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .agents/mcp-servers/${{ matrix.server }}/package-lock.json

      - run: npm ci

      - run: npm run check

      # security-mcp's `check` runs `build`, so a stale committed dist/ is
      # repaired in place and the dirty tree is the only signal it was stale.
      # research-mcp omits `build`, and the same staleness fails inside
      # check:bundle instead.
      - name: Working tree is clean
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
            echo '::error title=Working tree is dirty::A step left tracked changes or new files behind.'
            exit 1
          fi
